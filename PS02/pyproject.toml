[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ps02-reconciliation-dashboard"
version = "0.1.0"
description = "Transparent invoice and payment reconciliation dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "rapidfuzz>=3.9",
  "streamlit>=1.38",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
